name: Build Nintendo Switch

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark workspace as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Switch SDL2 ports
        run: dkp-pacman -Sy --noconfirm switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-sdl2_ttf

      - name: Configure
        run: >
          cmake -B build-switch
          -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DARTC_BUILD_SMOKE=OFF
          -DARTC_BUILD_PLATFORM=ON
        env:
          DEVKITPRO: /opt/devkitpro

      - name: Build
        run: cmake --build build-switch --parallel
        env:
          DEVKITPRO: /opt/devkitpro

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find build-switch -name "*.nro" -exec cp {} dist/ \;

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-nx-switch
          path: dist/

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## 下载 | Download

            - `artemis_runner.nro` — 放入 SD 卡（如 `sdmc:/switch/artemis-nx/`），homebrew 菜单直接运行
            - 由 devkitA64 容器从源码自动构建；**不含任何游戏资源**，请使用合法拥有的游戏数据

            License: MIT
